<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 680" role="img" aria-label="Animated cute chibi avatar"><defs><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd9c2"/><stop offset="1" stop-color="#f6b79d"/></linearGradient><linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ead7a8"/><stop offset="1" stop-color="#c9b27d"/></linearGradient><style><![CDATA[
svg{overflow:visible}.body{transform-box:fill-box;transform-origin:center;animation:breathe 3.2s ease-in-out infinite}.head{transform-box:fill-box;transform-origin:50% 70%;animation:head 4.6s ease-in-out infinite}.hair{transform-box:fill-box;transform-origin:50% 80%;animation:hair 4.6s ease-in-out infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s ease-in-out infinite}.mouth{transform-box:fill-box;transform-origin:center;animation:smile 5s ease-in-out infinite}.armL{transform-box:fill-box;transform-origin:100% 10%;animation:armL 4s ease-in-out infinite}.armR{transform-box:fill-box;transform-origin:0 10%;animation:armR 4s ease-in-out infinite}.badge{transform-box:fill-box;transform-origin:50% 0;animation:badge 3.2s ease-in-out infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.4s ease-in-out infinite}.spark2{animation-delay:.8s}.spark3{animation-delay:1.6s}@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.012,.995)}}@keyframes head{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(-3px)}}@keyframes hair{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}44%,46%{transform:scaleY(.08)}}@keyframes smile{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}@keyframes armL{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}@keyframes armR{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}@keyframes badge{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(4px) rotate(2deg)}}@keyframes spark{0%,100%{opacity:.25;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style></defs>
